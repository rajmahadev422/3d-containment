<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radiation Shielding Containment — 3D Model</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #0b0e13; font-family: 'Segoe UI', Arial, sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; display: block; }

  #panel {
    position: absolute; top: 16px; left: 16px;
    background: rgba(18, 22, 30, 0.88);
    border: 1px solid rgba(120,160,200,0.25);
    border-radius: 10px;
    padding: 16px 18px;
    color: #dce8f2;
    width: 260px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
  }
  #panel h1 {
    font-size: 15px; margin: 0 0 4px 0; letter-spacing: 0.5px; color: #7fd0ff;
    font-weight: 600;
  }
  #panel p.sub { font-size: 11px; color: #8fa3b5; margin: 0 0 14px 0; }

  .ctrl-group { margin-bottom: 12px; }
  .ctrl-group label {
    display: block; font-size: 11px; color: #a8bacb; margin-bottom: 5px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .row { display: flex; gap: 6px; }
  button {
    background: #1b2530; color: #cfe4f5; border: 1px solid rgba(120,160,200,0.3);
    border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    flex: 1; transition: all 0.15s;
  }
  button:hover { background: #26333f; border-color: #5fb0e0; }
  button.active { background: #2c6a94; border-color: #7fd0ff; color: #fff; }

  #legend {
    position: absolute; bottom: 16px; left: 16px;
    background: rgba(18, 22, 30, 0.88);
    border: 1px solid rgba(120,160,200,0.25);
    border-radius: 10px;
    padding: 12px 16px;
    color: #cfe4f5;
    font-size: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #legend .item { display: flex; align-items: center; margin: 4px 0; }
  #legend .swatch { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; display: inline-block; }

  #hint {
    position: absolute; bottom: 16px; right: 16px;
    color: #6f8394; font-size: 11px; text-align: right;
    background: rgba(18,22,30,0.6); padding: 8px 12px; border-radius: 8px;
  }

  #label-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .tag {
    position: absolute; transform: translate(-50%, -50%);
    color: #eaf4ff; font-size: 12px; font-weight: 500;
    background: rgba(15,20,28,0.75); padding: 3px 9px; border-radius: 5px;
    border: 1px solid rgba(120,180,220,0.35);
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div id="label-layer"></div>

<div id="panel">
  <h1>CONTAINMENT STRUCTURE</h1>
  <p class="sub">Radiation shielding — dome / wall / base slab</p>

  <div class="ctrl-group">
    <label>View mode</label>
    <div class="row">
      <button id="btn-solid" class="active">Solid</button>
      <button id="btn-cutaway">Cutaway</button>
      <button id="btn-wire">Wireframe</button>
    </div>
  </div>

  <div class="ctrl-group">
    <label>Components</label>
    <div class="row">
      <button id="btn-labels" class="active">Labels</button>
      <button id="btn-explode">Explode</button>
    </div>
  </div>

  <div class="ctrl-group">
    <label>Rotation</label>
    <div class="row">
      <button id="btn-spin" class="active">Auto-spin</button>
    </div>
  </div>
</div>

<div id="legend">
  <div class="item"><span class="swatch" style="background:#8fa9c2;"></span>Dome (hemispherical head)</div>
  <div class="item"><span class="swatch" style="background:#b7c4d4;"></span>Cylindrical wall</div>
  <div class="item"><span class="swatch" style="background:#6b7280;"></span>Base slab / foundation</div>
</div>

<div id="hint">Drag to orbit &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; Right-drag to pan</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
  const container = document.getElementById('canvas-container');
  const labelLayer = document.getElementById('label-layer');

  // ---------- Scene / Camera / Renderer ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0e13);
  scene.fog = new THREE.Fog(0x0b0e13, 20, 60);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 200);
  camera.position.set(14, 10, 16);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 6;
  controls.maxDistance = 45;
  controls.maxPolarAngle = Math.PI * 0.95;
  controls.target.set(0, 4, 0);

  // ---------- Lighting ----------
  scene.add(new THREE.AmbientLight(0x8fa3c0, 0.55));

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.05);
  keyLight.position.set(12, 20, 10);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -20;
  keyLight.shadow.camera.right = 20;
  keyLight.shadow.camera.top = 20;
  keyLight.shadow.camera.bottom = -20;
  scene.add(keyLight);

  const rimLight = new THREE.DirectionalLight(0x7fd0ff, 0.4);
  rimLight.position.set(-15, 8, -10);
  scene.add(rimLight);

  const fillLight = new THREE.PointLight(0xffe8c0, 0.3, 40);
  fillLight.position.set(-6, 6, 8);
  scene.add(fillLight);

  // ---------- Ground ----------
  const groundGeo = new THREE.CircleGeometry(30, 64);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x11151c, roughness: 1, metalness: 0 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.02;
  ground.receiveShadow = true;
  scene.add(ground);

  const grid = new THREE.GridHelper(30, 30, 0x2a3646, 0x1a222c);
  grid.position.y = -0.01;
  scene.add(grid);

  // ---------- Structure dimensions ----------
  const WALL_RADIUS   = 5.0;   // outer radius of cylindrical wall
  const WALL_HEIGHT   = 8.0;
  const SLAB_RADIUS   = 6.5;
  const SLAB_HEIGHT   = 1.4;
  const DOME_SEGMENTS = 48;

  const slabTopY = SLAB_HEIGHT;
  const wallTopY = slabTopY + WALL_HEIGHT;

  // ---------- Materials ----------
  const domeMat = new THREE.MeshStandardMaterial({
    color: 0x8fa9c2, roughness: 0.55, metalness: 0.15,
    side: THREE.DoubleSide
  });
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0xb7c4d4, roughness: 0.6, metalness: 0.1,
    side: THREE.DoubleSide
  });
  const slabMat = new THREE.MeshStandardMaterial({
    color: 0x6b7280, roughness: 0.85, metalness: 0.05,
    side: THREE.DoubleSide
  });
  const rebar = new THREE.MeshStandardMaterial({ color: 0x3a3f46, roughness: 0.4, metalness: 0.6 });

  // ---------- Group (whole assembly, for explode/rotate) ----------
  const assembly = new THREE.Group();
  scene.add(assembly);

  // ---------- Base Slab (rectangular foundation) ----------
  const SLAB_WIDTH = SLAB_RADIUS * 2.15;
  const SLAB_DEPTH = SLAB_RADIUS * 2.15;
  const slabGeo = new THREE.BoxGeometry(SLAB_WIDTH, SLAB_HEIGHT, SLAB_DEPTH);
  const slab = new THREE.Mesh(slabGeo, slabMat);
  slab.position.y = SLAB_HEIGHT/2;
  slab.castShadow = true;
  slab.receiveShadow = true;
  assembly.add(slab);

  // chamfered edge detail along top perimeter of the slab (visual only)
  const edgeMat = slabMat.clone();
  edgeMat.color = new THREE.Color(0x5a6068);
  const edgeGeo = new THREE.BoxGeometry(SLAB_WIDTH + 0.02, 0.06, SLAB_DEPTH + 0.02);
  const slabTopEdge = new THREE.Mesh(edgeGeo, edgeMat);
  slabTopEdge.position.y = SLAB_HEIGHT;
  assembly.add(slabTopEdge);

  // ---------- Cylindrical Wall ----------
  const wallThickness = 0.6;
  const wallOuterGeo = new THREE.CylinderGeometry(WALL_RADIUS, WALL_RADIUS, WALL_HEIGHT, DOME_SEGMENTS, 1, true);
  const wallOuter = new THREE.Mesh(wallOuterGeo, wallMat);
  wallOuter.position.y = slabTopY + WALL_HEIGHT/2;
  wallOuter.castShadow = true;
  wallOuter.receiveShadow = true;
  assembly.add(wallOuter);

  const wallInnerGeo = new THREE.CylinderGeometry(WALL_RADIUS - wallThickness, WALL_RADIUS - wallThickness, WALL_HEIGHT, DOME_SEGMENTS, 1, true);
  const wallInnerMat = wallMat.clone();
  wallInnerMat.side = THREE.BackSide;
  const wallInner = new THREE.Mesh(wallInnerGeo, wallInnerMat);
  wallInner.position.y = slabTopY + WALL_HEIGHT/2;
  assembly.add(wallInner);

  // top ring of the wall (closing surface between wall and dome)
  const wallTopRingGeo = new THREE.RingGeometry(WALL_RADIUS - wallThickness, WALL_RADIUS, DOME_SEGMENTS);
  const wallTopRing = new THREE.Mesh(wallTopRingGeo, wallMat);
  wallTopRing.rotation.x = -Math.PI/2;
  wallTopRing.position.y = wallTopY;
  assembly.add(wallTopRing);

  // bottom ring (wall meets slab)
  const wallBottomRing = new THREE.Mesh(wallTopRingGeo.clone(), wallMat);
  wallBottomRing.rotation.x = -Math.PI/2;
  wallBottomRing.position.y = slabTopY;
  assembly.add(wallBottomRing);

  // ---------- Dome (hemispherical bowl, inverted over the top) ----------
  const domeOuterGeo = new THREE.SphereGeometry(WALL_RADIUS, DOME_SEGMENTS, DOME_SEGMENTS/2, 0, Math.PI*2, 0, Math.PI/2);
  const domeOuter = new THREE.Mesh(domeOuterGeo, domeMat);
  domeOuter.position.y = wallTopY;
  domeOuter.castShadow = true;
  domeOuter.receiveShadow = true;
  assembly.add(domeOuter);

  const domeInnerGeo = new THREE.SphereGeometry(WALL_RADIUS - wallThickness, DOME_SEGMENTS, DOME_SEGMENTS/2, 0, Math.PI*2, 0, Math.PI/2);
  const domeInnerMat = domeMat.clone();
  domeInnerMat.side = THREE.BackSide;
  const domeInner = new THREE.Mesh(domeInnerGeo, domeInnerMat);
  domeInner.position.y = wallTopY;
  assembly.add(domeInner);

  // small apex hatch (visual detail, like a containment access hatch)
  const hatchGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.25, 24);
  const hatchMat = new THREE.MeshStandardMaterial({ color: 0x2c333b, roughness: 0.4, metalness: 0.7 });
  const hatch = new THREE.Mesh(hatchGeo, hatchMat);
  hatch.position.y = wallTopY + WALL_RADIUS + 0.1;
  assembly.add(hatch);

  // ---------- Rebar-style vertical ribs on wall (visual/structural detail) ----------
  const ribCount = 24;
  const ribGeo = new THREE.CylinderGeometry(0.04, 0.04, WALL_HEIGHT - 0.2, 6);
  for (let i = 0; i < ribCount; i++) {
    const ang = (i / ribCount) * Math.PI * 2;
    const rib = new THREE.Mesh(ribGeo, rebar);
    rib.position.set(
      Math.cos(ang) * (WALL_RADIUS - 0.05),
      slabTopY + WALL_HEIGHT/2,
      Math.sin(ang) * (WALL_RADIUS - 0.05)
    );
    assembly.add(rib);
  }

  // ---------- Ground shadow-catcher ring around slab ----------
  // (kept simple; slab already receives/casts shadow)

  // ---------- Label anchors (3D positions projected to 2D) ----------
  const labelDefs = [
    { text: "Dome (radiation shield head)", pos: new THREE.Vector3(0, wallTopY + WALL_RADIUS * 0.65, WALL_RADIUS * 0.65) },
    { text: "Cylindrical containment wall", pos: new THREE.Vector3(WALL_RADIUS, slabTopY + WALL_HEIGHT * 0.55, 0) },
    { text: "Base slab / foundation", pos: new THREE.Vector3(SLAB_RADIUS * 0.75, SLAB_HEIGHT * 0.5, SLAB_RADIUS * 0.75) },
    { text: "Access hatch", pos: new THREE.Vector3(0, wallTopY + WALL_RADIUS + 0.3, 0) },
  ];
  const labelEls = labelDefs.map(def => {
    const el = document.createElement('div');
    el.className = 'tag';
    el.textContent = def.text;
    labelLayer.appendChild(el);
    return { el, pos: def.pos };
  });

  function updateLabels() {
    if (!labelsVisible) { labelEls.forEach(l => l.el.style.display = 'none'); return; }
    labelEls.forEach(l => {
      const v = l.pos.clone().project(camera);
      const x = (v.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
      const behind = v.z > 1;
      l.el.style.display = behind ? 'none' : 'block';
      l.el.style.left = x + 'px';
      l.el.style.top = y + 'px';
    });
  }

  // ---------- UI State ----------
  let labelsVisible = true;
  let autoSpin = true;
  let exploded = false;
  let viewMode = 'solid';

  function setActive(btnId, group) {
    group.forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById(btnId).classList.add('active');
  }

  document.getElementById('btn-solid').onclick = () => {
    viewMode = 'solid';
    setActive('btn-solid', ['btn-solid','btn-cutaway','btn-wire']);
    applyViewMode();
  };
  document.getElementById('btn-cutaway').onclick = () => {
    viewMode = 'cutaway';
    setActive('btn-cutaway', ['btn-solid','btn-cutaway','btn-wire']);
    applyViewMode();
  };
  document.getElementById('btn-wire').onclick = () => {
    viewMode = 'wire';
    setActive('btn-wire', ['btn-solid','btn-cutaway','btn-wire']);
    applyViewMode();
  };
  document.getElementById('btn-labels').onclick = (e) => {
    labelsVisible = !labelsVisible;
    e.target.classList.toggle('active', labelsVisible);
  };
  document.getElementById('btn-explode').onclick = (e) => {
    exploded = !exploded;
    e.target.classList.toggle('active', exploded);
  };
  document.getElementById('btn-spin').onclick = (e) => {
    autoSpin = !autoSpin;
    e.target.classList.toggle('active', autoSpin);
  };

  const allMeshMats = [domeMat, wallMat, slabMat, domeInnerMat, wallInnerMat];

  function applyViewMode() {
    // reset clipping
    renderer.localClippingEnabled = true;
    const clipPlane = new THREE.Plane(new THREE.Vector3(1,0,0), 0);

    allMeshMats.forEach(m => {
      m.wireframe = (viewMode === 'wire');
      if (viewMode === 'cutaway') {
        m.clippingPlanes = [clipPlane];
        m.side = THREE.DoubleSide;
      } else {
        m.clippingPlanes = [];
      }
    });
  }

  // ---------- Explode animation targets ----------
  const explodeOffsets = {
    slab: 0,
    wall: 1.6,
    dome: 3.6,
    hatch: 4.4
  };

  function updateExplode(dt) {
    const targetWall = exploded ? explodeOffsets.wall : 0;
    const targetDome = exploded ? explodeOffsets.dome : 0;
    const targetHatch = exploded ? explodeOffsets.hatch : 0;

    // lerp helper
    const lerp = (obj, targetY, baseY) => {
      const goal = baseY + targetY;
      obj.position.y += (goal - obj.position.y) * 0.08;
    };

    lerp(wallOuter, targetWall, slabTopY + WALL_HEIGHT/2);
    lerp(wallInner, targetWall, slabTopY + WALL_HEIGHT/2);
    lerp(wallTopRing, targetWall, wallTopY);
    lerp(wallBottomRing, targetWall, slabTopY);

    lerp(domeOuter, targetWall + targetDome, wallTopY);
    lerp(domeInner, targetWall + targetDome, wallTopY);
    lerp(hatch, targetWall + targetDome + targetHatch, wallTopY + WALL_RADIUS + 0.1);

    assembly.children.forEach(c => {
      if (c.geometry === ribGeo) {
        lerp(c, targetWall, slabTopY + WALL_HEIGHT/2);
      }
    });
  }

  // ---------- Resize ----------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- Animate ----------
  function animate() {
    requestAnimationFrame(animate);
    if (autoSpin) assembly.rotation.y += 0.0035;
    updateExplode();
    controls.update();
    updateLabels();
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
